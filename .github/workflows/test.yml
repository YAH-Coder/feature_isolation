name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Build on ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies on ${{ matrix.os }}
        run: |
          echo "Installing dependencies on ${{ matrix.os }}..."
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y libfmt-dev libz3-dev make
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew update
            brew install fmt z3 make
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Install Chocolatey (if not already installed)
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            
            # Install dependencies
            choco install -y make fmt z3 git
          fi

      - name: Install Git Bash on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y git
        # Git Bash is installed with Git for Windows by default

      - name: Set Environment Variables for Dependencies
        run: |
          echo "Setting environment variables..."
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "FMT_PREFIX=/usr" >> $GITHUB_ENV
            echo "Z3_PREFIX=/usr" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "FMT_PREFIX=$(brew --prefix fmt)" >> $GITHUB_ENV
            echo "Z3_PREFIX=$(brew --prefix z3)" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Adjust paths based on Chocolatey installation
            echo "FMT_PREFIX=C:/ProgramData/chocolatey/lib/fmt/tools" >> $GITHUB_ENV
            echo "Z3_PREFIX=C:/ProgramData/chocolatey/lib/z3/tools" >> $GITHUB_ENV
          fi

      - name: Build and Test
        run: |
          make clean
          make test
        shell: bash
